name: iOS

on:
  push:
    branches: [main]
    tags: ['ios-v*']
    paths:
      - 'ios/**'
      - 'scripts/check-swift.sh'
      - 'scripts/bump-ios-version.sh'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/check-swift.sh'
      - 'scripts/bump-ios-version.sh'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Release script checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check script syntax
        run: |
          bash -n scripts/check-swift.sh
          bash -n scripts/bump-ios-version.sh
