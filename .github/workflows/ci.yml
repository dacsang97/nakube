name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Saving a cache needs this. Only main writes; other refs restore.
  actions: write

# A newer push replaces the run still going for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --timeout=5m
          # Main writes the linter cache. Other refs only restore it.
          skip-save-cache: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check release script syntax
        run: sh -n scripts/release.sh
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Warm Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}
