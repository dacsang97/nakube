version: 2

project_name: nakube

before:
  hooks:
    - go mod tidy

builds:
  - id: nakube
    main: ./cmd/nakube
    binary: nakube
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    name_template: "nakube_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# App packages (app, dmg, nsis) come from `go tool mygo build` via
# scripts/release.sh. This file only compile-checks those targets.
release:
  disable: true

changelog:
  disable: true
